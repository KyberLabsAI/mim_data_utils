<!DOCTYPE html>
<html>
<head>
<style>
    body, html {
        height: 100%;
        margin: 0;
    }

    body, html {
  height: 100%;
  margin: 0;
}

:root {
    --layout-panel-width: 360px;
}

.container {
    display: grid;
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: min-content 1fr;
    overflow: hidden;
}

/* When the layout side panel is open, push only the lower views row right so it
   shrinks instead of being hidden behind the panel. The top toolbar row stays
   fixed and full-width. */
body.layout-panel-open .panel-root {
    margin-left: var(--layout-panel-width);
}

.top {
    grid-column: 1 / span 2;
    grid-row: 1 / 1;
    position: sticky; top: 0;
    padding: 4px 8px 4px 8px;
    background: white;
    z-index: 1;
}

.left-div {
    flex: 1;
    overflow: auto;
    min-width: 0;
    min-height: 0;
}

.panel-root {
    grid-column: 1 / span 2;
    grid-row: 2 / 2;
    display: flex;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
}

.panel-split {
    display: flex;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
}

.panel-split.row {
    flex-direction: row;
}

.panel-split.column {
    flex-direction: column;
}

.panel-leaf {
    flex: 1 1 0;
    position: relative;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.md-panel {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    min-height: 0;
    padding: 6px 8px;
    box-sizing: border-box;
    font-family: sans-serif;
    font-size: 13px;
}

.md-empty {
    color: #888;
    font-style: italic;
    padding: 8px;
}

.md-bubble {
    background: #f1f3f6;
    border: 1px solid #d8dde4;
    border-radius: 10px;
    padding: 4px 10px 6px;
    margin: 6px 0;
    cursor: pointer;
}

.md-bubble.md-current {
    background: #fff4d6;
    border-color: #f0a020;
    box-shadow: 0 0 0 2px #f0a02055;
}

.md-bubble.md-future {
    opacity: 0.45;
}

.md-img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 4px 0;
}

.md-mark {
    color: #c0392b;
    font-weight: bold;
    margin-left: 6px;
}

.md-goto {
    float: right;
    font-size: 11px;
    padding: 0 6px;
    margin-left: 6px;
    border: 1px solid #b8bec7;
    border-radius: 4px;
    background: #ffffff;
    color: #445;
    cursor: pointer;
}

.md-goto:hover {
    background: #e6f0ff;
    border-color: #6a9be0;
}

.md-time {
    font-size: 11px;
    color: #667;
    font-family: monospace;
}

.md-body p, .md-body ul, .md-body ol, .md-body pre, .md-body blockquote, .md-body table {
    margin: 4px 0;
}

.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
    margin: 4px 0;
    font-size: 1.05em;
}

.md-body h1 { font-size: 1.3em; }
.md-body h2 { font-size: 1.15em; }

.md-body pre {
    background: #272c34;
    color: #e6e6e6;
    padding: 6px 8px;
    border-radius: 6px;
    overflow-x: auto;
}

.md-body code {
    font-family: monospace;
    background: #e3e6ea;
    padding: 0 3px;
    border-radius: 3px;
}

.md-body pre code {
    background: none;
    padding: 0;
}

.md-body blockquote {
    border-left: 3px solid #c5cad1;
    padding-left: 8px;
    color: #555;
}

.md-body table {
    border-collapse: collapse;
}

.md-body th, .md-body td {
    border: 1px solid #d0d5dc;
    padding: 1px 6px;
}

.cameras-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: auto;
    min-width: 0;
    min-height: 0;
}

.camera-panel {
    flex: 1 1 0;
    min-width: 200px;
    /* Allow the flex item to shrink to its allotted height instead of expanding
       to the canvas's intrinsic height (min-height:auto), which would overflow
       the container and show a scrollbar. */
    min-height: 0;
    position: relative;
    overflow: hidden;
}

.camera-panel img,
.camera-panel canvas {
    display: block; /* avoid the inline baseline gap that adds a few px below and forces a scrollbar */
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #888;
}

.camera-panel video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Fill mode 'width' (Set Layout -> Visuals -> Fill): each image takes the
   panel's full width at its own aspect ratio and the panel scrolls vertically,
   instead of all images sharing (and being fitted into) the panel's height. */
.cameras-container.fill-width .camera-panel {
    flex: none;
}

.cameras-container.fill-width .camera-panel img,
.cameras-container.fill-width .camera-panel canvas,
.cameras-container.fill-width .camera-panel video {
    height: auto;
}

.camera-label {
    position: absolute;
    top: 4px;
    left: 4px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 2px 6px;
    font-size: 12px;
    z-index: 1;
}

.viewer-panel {
    flex: 1;
    position: relative;
    display: block;
}

.viewer-panel canvas {
    position: absolute;
    bottom: 0;
    top: 0;
    left: 0;
    right: 0;
}

.legend {
  position: absolute;
  left: 80px;
  text-align: right;
  background: rgba(255, 255, 255, 0.5);
  font-family: monospace;
  font-size: 12px;
}

.legend td.label {
  text-align: left;
  border-width: 0;
  border-style: solid;
  border-right-width: 3px;
  padding-right: 3px;
  margin-bottom: 3px
}

.message {
  font-size: 16px;
  font-weight: bold;
}

</style>
</head>
<body>
    <div class="container">
    <div class="top">
        <p style="margin:0 0 2px 0">
        <b>Plotting Tool</b>
        <button onclick="loadDataFile()">Load Data File</button>
        <button onclick="connectViaWebSocket()">Start Streaming</button>
        <!-- <button onclick="updateLayout()">Refresh Layout</button>
        <button onclick="onRefreshDerivedClick()">Refresh Derived</button> -->
        <button onclick="freeze()">Freeze</button>
        <button onclick="toggleLayoutWindow()">Set Layout</button>
        <button onclick="removeMark()">Remove Mark</button>
        <button onclick="stepBack()">t--</button>
        <button onclick="stepForward()">t++</button>
        <span>Layout:</span>
        <select id="xlimDom">
          <option value="0.1">0.1 s</option>
          <option value="0.2">0.2 s</option>
          <option value="0.5">0.5 s</option>
          <option value="1">1 s</option>
          <option value="2">2 s</option>
          <option value="3">3 s</option>
          <option value="5" selected="selected">5 s</option>
          <option value="10">10 s</option>
          <option value="20">20 s</option>
          <option value="30">30 s</option>
          <option value="45">45 s</option>
          <option value="60">60 s</option>
          <option value="90">90 s</option>
          <option value="120">120 s</option>
          <option value="1000">1000 s</option>
          </select>

        <!-- Trace controls live in the layout window ("Set Layout" button or the "l"
             hotkey). Kept here in a hidden holder so main.js can bind to them at load;
             openLayoutWindow() reparents them into the Traces section while open and
             returns them here on close. -->
        <span id="tracesHolder" style="display:none">
              <select style="width:150px" id="addOptions">
              <option value="$add">Add trace...</option>
              <option value="$newPlot">New Plot</option>
              <option value="sin">sin[1]</option>
            </select>
            <input id="layout" style="font-size:1em;flex: 1 1 auto" value="trig[0];trig[1]"></input>
        </span>
        <div id="message" class="message"></div>
        </p>
    </div>
    <div id="panelRoot" class="panel-root">
        <div class="left-div" id="plots"></div>
        <div class="cameras-container" id="camerasContainer"></div>
        <div id="viewer" class="viewer-panel"></div>
        <div id="mdPanel" class="md-panel"></div>
    </div>
  </div>



  <script id="vertex" type="x-shader/x-vertex">
    #version 300 es
    precision highp float;

    uniform vec2 u_offset;
    uniform mat2 u_transformCenter;
    uniform vec4 u_color;
    uniform float u_z;
    uniform mat2 u_viewport2pixel;
    uniform float u_aspectCorrection;

    in vec2 lineCenter;
    in vec2 lineTangential;
    out vec4 v_color;

    void main() {
      float lineWidth = 1.;

      mat2 transformTangential = mat2(u_transformCenter[1][1], 0, 0, u_transformCenter[0][0]);
      vec2 tangentialViewport = transformTangential * lineTangential;
      tangentialViewport.x = tangentialViewport.x * u_aspectCorrection;

      vec2 tangentialPixel = u_viewport2pixel * tangentialViewport;
      vec2 lwTangential = (lineWidth / length(tangentialPixel)) * tangentialViewport;

      gl_Position = vec4(
        (u_transformCenter * (lineCenter.xy + u_offset) + lwTangential).xy,
        u_z, 1
      );
      v_color = u_color;
    }
  </script>

  <script id="fragment" type="x-shader/x-fragment">
    #version 300 es
    precision highp float;

    in vec4 v_color;
    out vec4 fragColor;

    void main() {
      fragColor = v_color;
    }
  </script>

  <script src="js/main.js"></script>
</body>
